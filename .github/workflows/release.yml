name: Release

# A pushed tag such as v0.2.0 builds, signs and publishes that release, then
# updates the Homebrew formula. Running the workflow by hand from main is a
# dry run: it builds, signs, notarizes and packages, checks that the tap token
# can push, and publishes nothing. See RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The repository the formula is committed to.
  HOMEBREW_TAP: x6c-co/homebrew-tap

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    name: Check the version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache in this workflow: what it builds is released.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - id: version
        run: |
          # Prints "age-plugin-rypt X.Y.Z", where X.Y.Z is const version in main.go.
          output="$(go run . --version)"
          version="${output#age-plugin-rypt }"
          if [ "$version" = "$output" ] || ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::go run . --version printed \"$output\", not \"age-plugin-rypt X.Y.Z\"."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match version $version in main.go."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  notices:
    name: Collect third-party licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Write LICENSE-THIRD-PARTY
        run: scripts/third-party-licenses.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: license-third-party
          path: LICENSE-THIRD-PARTY
          if-no-files-found: error

  build:
    name: Build
    needs: [test, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      macos-unsigned-artifact-id: ${{ steps.upload-macos.outputs.artifact-id }}
    env:
      # No C toolchain: the Linux binaries are statically linked, so they run
      # whatever the C library on the system, and the macOS binaries can be
      # cross-compiled here.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Build
        run: |
          go version
          for target in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            GOOS="${target%-*}" GOARCH="${target#*-}" \
              go build -trimpath -ldflags="-s -w" -o "artifacts/bin-$target/age-plugin-rypt" .
          done
      - name: Check the binaries
        run: |
          check() {
            local description
            description="$(file --brief "artifacts/bin-$1/age-plugin-rypt")"
            echo "$1: $description"
            if ! grep -Eq "$2" <<< "$description"; then
              echo "::error::The $1 binary is not what was expected."
              exit 1
            fi
          }
          check darwin-arm64 '^Mach-O 64-bit arm64 executable'
          check darwin-amd64 '^Mach-O 64-bit x86_64 executable'
          check linux-arm64 '^ELF 64-bit LSB [a-z-]*executable, ARM aarch64,.*(statically linked|static-pie linked)'
          check linux-amd64 '^ELF 64-bit LSB [a-z-]*executable, x86-64,.*(statically linked|static-pie linked)'
          scripts/smoke-test.sh artifacts/bin-linux-amd64/age-plugin-rypt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-linux-amd64
          path: artifacts/bin-linux-amd64/age-plugin-rypt
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-linux-arm64
          path: artifacts/bin-linux-arm64/age-plugin-rypt
          if-no-files-found: error
      # Signed in macos-sign, which uploads them as bin-darwin-arm64 and
      # bin-darwin-amd64. Inside this artifact they are
      # bin-darwin-arm64/age-plugin-rypt and bin-darwin-amd64/age-plugin-rypt.
      - id: upload-macos
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-unsigned
          path: |
            artifacts/bin-darwin-arm64/age-plugin-rypt
            artifacts/bin-darwin-amd64/age-plugin-rypt
          if-no-files-found: error

  linux-arm64:
    name: Run the binary (linux-arm64)
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-linux-arm64
          path: artifacts/bin-linux-arm64
      - name: Run the binary
        run: |
          if [ "$(uname -m)" != aarch64 ]; then
            echo "::error::This runner is $(uname -m), not aarch64."
            exit 1
          fi
          chmod +x artifacts/bin-linux-arm64/age-plugin-rypt
          scripts/smoke-test.sh artifacts/bin-linux-arm64/age-plugin-rypt

  macos-sign:
    name: Sign and notarize (macOS)
    needs: [version, build]
    runs-on: macos-15
    timeout-minutes: 240
    # This job holds the Apple secrets, so it checks out nothing, builds
    # nothing and runs no third-party code: anything that ran here could
    # steal the keys.
    environment: release
    outputs:
      signed: ${{ steps.setup.outputs.signed }}
    env:
      APPLE_ALL: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_P8_BASE64 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' }}
      APPLE_ANY: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' || secrets.MACOS_CERTIFICATE_PASSWORD != '' || secrets.APPLE_API_KEY_P8_BASE64 != '' || secrets.APPLE_API_KEY_ID != '' || secrets.APPLE_API_ISSUER_ID != '' }}
    steps:
      # Download by ID, so an artifact replaced under the same name is not used.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.macos-unsigned-artifact-id }}
          path: artifacts

      - name: Check the signing setup
        id: setup
        env:
          ALLOW_UNSIGNED: ${{ vars.ALLOW_UNSIGNED_MACOS }}
        run: |
          if [ "$APPLE_ALL" = true ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$APPLE_ANY" = true ]; then
            echo "::error::Some of the five Apple signing secrets are set, but not all. See RELEASING.md."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$ALLOW_UNSIGNED" != true ]; then
            echo "::error::The Apple signing secrets are not set, so the macOS binaries would be blocked by Gatekeeper when downloaded in a browser. Add the secrets, or set the repository variable ALLOW_UNSIGNED_MACOS to true to release anyway. See RELEASING.md."
            exit 1
          fi
          echo "::warning::The macOS binaries are not signed or notarized."
          echo "signed=false" >> "$GITHUB_OUTPUT"

      - name: Import the Developer ID certificate
        if: steps.setup.outputs.signed == 'true'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          # Add it to the search list, keeping the keychains already there.
          keychains=("$keychain")
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line#\"}"
            keychains+=("${line%\"}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/"Developer ID Application: / { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::The certificate gives no valid Developer ID Application identity. It may be expired or revoked, be a different kind of certificate, or have been exported without its private key."
            exit 1
          fi
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      # --force replaces the ad-hoc signature that Go's linker gives the
      # arm64 binary.
      - name: Sign
        if: steps.setup.outputs.signed == 'true'
        run: |
          for target in darwin-arm64 darwin-amd64; do
            binary="artifacts/bin-$target/age-plugin-rypt"
            codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN" \
              --options runtime --timestamp --identifier dev.rypt.age-plugin-rypt "$binary"
            codesign --verify --strict --verbose=2 "$binary"
          done

      - name: Notarize
        if: steps.setup.outputs.signed == 'true'
        env:
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$API_KEY_P8_BASE64" | base64 --decode > "$key"
          auth=(--key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
          name="age-plugin-rypt-v$VERSION"
          mkdir "$RUNNER_TEMP/$name"
          for target in darwin-arm64 darwin-amd64; do
            cp "artifacts/bin-$target/age-plugin-rypt" "$RUNNER_TEMP/$name/age-plugin-rypt-$target"
          done
          ditto -c -k --keepParent "$RUNNER_TEMP/$name" "$RUNNER_TEMP/$name.zip"

          xcrun notarytool submit "$RUNNER_TEMP/$name.zip" "${auth[@]}" \
            --output-format json > "$RUNNER_TEMP/submission.json" || true
          cat "$RUNNER_TEMP/submission.json"
          id="$(jq -r '.id // empty' "$RUNNER_TEMP/submission.json" 2> /dev/null || true)"
          if [ -z "$id" ]; then
            echo "::error::The upload to Apple's notary service failed."
            exit 1
          fi
          echo "Notarization submission: $id" | tee -a "$GITHUB_STEP_SUMMARY"

          # Apple can hold a team's first submissions for review for a day.
          # Wait in rounds, so that a dropped connection doesn't end the wait.
          status=
          for round in 1 2 3 4 5 6; do
            xcrun notarytool wait "$id" "${auth[@]}" --timeout 30m > /dev/null 2>&1 || true
            xcrun notarytool info "$id" "${auth[@]}" --output-format json > "$RUNNER_TEMP/info.json" 2> /dev/null || true
            status="$(jq -r '.status // empty' "$RUNNER_TEMP/info.json" 2> /dev/null || true)"
            echo "Round $round: ${status:-no answer}"
            if [ -n "$status" ] && [ "$status" != "In Progress" ]; then
              break
            fi
            sleep 30
          done
          xcrun notarytool log "$id" "${auth[@]}" "$RUNNER_TEMP/notarization-log.json" > /dev/null 2>&1 \
            && cat "$RUNNER_TEMP/notarization-log.json" || true
          if [ "$status" != Accepted ]; then
            echo "::error::Notarization of submission $id ended as ${status:-unknown}. If Apple is still reviewing it, re-run the workflow once 'xcrun notarytool info $id' says Accepted."
            exit 1
          fi

      - name: Remove the keychain and key
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-darwin-arm64
          path: artifacts/bin-darwin-arm64/age-plugin-rypt
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-darwin-amd64
          path: artifacts/bin-darwin-amd64/age-plugin-rypt
          if-no-files-found: error

  macos-verify:
    name: Check the signed binaries (macOS)
    needs: macos-sign
    runs-on: macos-15
    timeout-minutes: 15
    env:
      SIGNED: ${{ needs.macos-sign.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-darwin-*
          path: artifacts
      - name: Check the signatures
        if: env.SIGNED == 'true'
        run: |
          for target in darwin-arm64 darwin-amd64; do
            binary="artifacts/bin-$target/age-plugin-rypt"
            codesign --verify --strict --verbose=2 "$binary"
            details="$(codesign --display --verbose=2 "$binary" 2>&1)"
            echo "$details"
            grep -q '^Authority=Developer ID Application: ' <<< "$details"
            grep -q '^Timestamp=' <<< "$details"
            grep -Eq 'flags=0x[0-9a-f]+\([^)]*runtime' <<< "$details"
          done
      - name: Run the binaries
        run: |
          chmod +x artifacts/bin-*/age-plugin-rypt
          scripts/smoke-test.sh artifacts/bin-darwin-arm64/age-plugin-rypt
          if arch -x86_64 /usr/bin/true 2> /dev/null; then
            scripts/smoke-test.sh artifacts/bin-darwin-amd64/age-plugin-rypt
          else
            echo "::warning::Rosetta is not installed, so the darwin-amd64 binary was not run."
          fi

  release:
    name: Package and publish
    needs: [version, notices, build, linux-arm64, macos-sign, macos-verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The two Linux binaries from build and the two signed macOS binaries
      # from macos-sign, each in artifacts/bin-<os>-<arch>/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: license-third-party
          path: .
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/package-release.sh "$VERSION" artifacts dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256sums
          path: dist/SHA256SUMS
          if-no-files-found: error
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      # Last, so that a failure before it can be fixed by re-running the job.
      - name: Publish the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.macos-sign.outputs.signed }}
        run: |
          options=(--title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          case "$GITHUB_REF_NAME" in *-*) options+=(--prerelease) ;; esac
          if [ "$SIGNED" != true ]; then
            options+=(--notes "The macOS binaries in this release are not signed or notarized, so macOS blocks them when they are downloaded in a browser. Install with Homebrew, or download with curl.")
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS "${options[@]}"

  go-proxy:
    name: Announce the version to the Go module proxy
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # So that go install github.com/x6c-co/age-plugin-rypt@latest and
      # pkg.go.dev see the new version without waiting for someone to ask for
      # it. The release is already published, so a slow proxy does not fail it.
      - continue-on-error: true
        run: curl --silent --show-error --fail "https://proxy.golang.org/github.com/${GITHUB_REPOSITORY}/@v/${GITHUB_REF_NAME}.info"

  homebrew:
    name: Update the Homebrew formula
    needs: [version, release]
    # Not for prereleases such as v0.2.0-rc.1. A dry run checks the formula
    # and that the token can push, and commits nothing.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: homebrew-tap
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
          path: dist
      - name: Update the tap
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          DRY_RUN: ${{ github.event_name != 'push' }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, so the formula can't be updated. See RELEASING.md."
            exit 0
          fi
          python3 scripts/homebrew_formula.py "$VERSION" dist/SHA256SUMS \
            --repository "$GITHUB_REPOSITORY" > age-plugin-rypt.rb
          ruby -c age-plugin-rypt.rb
          git clone --depth 1 "https://github.com/${HOMEBREW_TAP}.git" tap
          cd tap
          # The token comes from the environment only when git asks for it, so
          # it is never written to disk or put on a command line. The single
          # quotes are deliberate: git's helper shell expands ${TAP_TOKEN}.
          push() {
            # shellcheck disable=SC2016
            git -c credential.helper= \
              -c 'credential.helper=!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=${TAP_TOKEN}"; }; f' \
              push "$@"
          }
          if [ "$DRY_RUN" = true ]; then
            push --dry-run origin HEAD
            echo "The token can push to $HOMEBREW_TAP. This was a dry run, so nothing was committed."
            exit 0
          fi
          formula=Formula/age-plugin-rypt.rb
          if [ -f "$formula" ]; then
            current="$(sed -n 's|.*/releases/download/v\([0-9][0-9.]*\)/.*|\1|p' "$formula" | head -1)"
            newest="$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)"
            if [ -n "$current" ] && [ "$current" != "$VERSION" ] && [ "$newest" = "$current" ]; then
              echo "::notice::The tap has $current, which is newer than $VERSION, so the formula was left alone."
              exit 0
            fi
          fi
          mkdir -p Formula
          cp ../age-plugin-rypt.rb "$formula"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$formula"
          if git diff --cached --quiet; then
            echo "The formula is already up to date."
            exit 0
          fi
          git commit --message "age-plugin-rypt $VERSION"
          push origin HEAD

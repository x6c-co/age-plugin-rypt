name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so that a new advisory against a dependency shows up.
    - cron: "23 7 * * 1"
  # The release workflow runs this first.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Fail, rather than skip, the tests that need the age CLI.
      AGE_PLUGIN_RYPT_REQUIRE_CLI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --component clippy --component rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install age
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install age
          else
            sudo apt-get update
            sudo apt-get install --yes age
          fi
          age --version
      - run: cargo fmt --check
      - name: Clippy
        # Not for release tags, so that lints added by a new Rust release
        # can't block a release.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: cargo clippy --all-targets --locked -- --deny warnings
      - run: cargo test --locked

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in step with rust-version in Cargo.toml.
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85 --profile minimal --no-self-update
      - run: cargo +1.85 check --all-targets --locked

  audit:
    name: Security advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

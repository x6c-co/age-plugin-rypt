name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so that a new advisory against a dependency shows up.
    - cron: "23 7 * * 1"
  # The release workflow runs this first.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Fail, rather than skip, the tests that need the age CLI.
      AGE_PLUGIN_RYPT_REQUIRE_CLI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The latest Go release; go.mod's go line is the oldest Go the module
      # supports, which the min-go job checks.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      # rage, a client built on the Rust age crate, is for the "Test with
      # rage" step below.
      - name: Install age, and rage on macOS
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install age rage
            rage --version
          else
            sudo apt-get update
            sudo apt-get install --yes age
          fi
          age --version
      - name: Check formatting
        # The gofmt of the Go that the go command runs. Its errors, such as a
        # file that doesn't parse, count as output.
        run: |
          out="$("$(go env GOROOT)/bin/gofmt" -l . 2>&1)" || true
          if [ -n "$out" ]; then
            echo "::error::These files need gofmt:"
            echo "$out"
            exit 1
          fi
      - name: Vet
        # Not for release tags, so that checks added by a new Go release
        # can't block a release.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: go vet ./...
      - name: Test
        # The race detector needs cgo.
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: Test with rage
        # The age CLI tests again, with rage in place of age. rage is built
        # on the Rust age crate, which reads the plugin protocol more
        # strictly than age: after an error, for example, it waits for
        # "done". AGE_PLUGIN_RYPT_CLI makes the tests use rage even though
        # age is installed. The race detector needs cgo.
        if: ${{ runner.os == 'macOS' }}
        env:
          CGO_ENABLED: "1"
          AGE_PLUGIN_RYPT_CLI: rage
        run: go test -race -count=1 ./e2e -run 'TestAgeCLI'

  min-go:
    name: Minimum Go version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Use the Go that setup-go installs, and fail rather than download a
      # newer one if go.mod asks for more.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Go named by go.mod's go line.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go version
      - run: go build ./...
      - run: go vet ./...

  vulncheck:
    name: Security advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      # Reports only the advisories whose vulnerable code the module can
      # reach, in its dependencies and in the standard library.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
